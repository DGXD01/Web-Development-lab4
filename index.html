<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Catalogue</title>
</head>

<body>
    <h1>Book Catalogue</h1>

    <div id="bookList"></div>

    <script>
        fetch("book.xml")
            .then(response => {
                return response.text();
            })
            .then(xmlText => {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, "text/xml");

                const books = xmlDoc.getElementsByTagName("book");
                let output = "";

                for (let i = 0; i < books.length; i++) {
                    const currentBook = books[i];

                    const title = currentBook
                        .getElementsByTagName("title")[0].textContent;

                    const author = currentBook
                        .getElementsByTagName("author")[0].textContent;

                    const price = currentBook
                        .getElementsByTagName("price")[0].textContent;

                    output += `
                        <div>
                            <h2>${title}</h2>
                            <p>Author: ${author}</p>
                            <p>Price: $${price}</p>
                        </div>
                    `;
                }

                document.getElementById("bookList").innerHTML = output;
            })
            .catch(error => {
                console.error("Error loading XML:", error);
            });
    </script>
</body>

</html>
